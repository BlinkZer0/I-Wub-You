<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>I Wub You</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="plugin">
  <!-- shared SVG defs: steel-blue knob face and rim -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="knobFace" cx="38%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#3a5a96"/>
        <stop offset="55%" stop-color="#1b2f5c"/>
        <stop offset="100%" stop-color="#0b1530"/>
      </radialGradient>
      <linearGradient id="knobRim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#9fc0ff"/>
        <stop offset="45%" stop-color="#3f5f9a"/>
        <stop offset="100%" stop-color="#101c3a"/>
      </linearGradient>
    </defs>
  </svg>

  <main class="synth">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 40 34" aria-hidden="true">
          <path class="bl-wave" d="M2 17 C6 4, 10 4, 14 17 S22 30, 26 17 S34 4, 38 17"/>
          <path class="bl-wave2" d="M2 17 C6 10, 10 10, 14 17 S22 24, 26 17 S34 10, 38 17"/>
          <circle class="bl-dot" cx="26" cy="17" r="3"/>
        </svg>
        <div class="brand-text">
          <span class="brand-mark">I WUB YOU</span>
          <span class="brand-sub">SOURCE-ADAPTIVE WOBBLE</span>
        </div>
      </div>
      <div class="patch-display">
        <button id="preset-prev" type="button" class="pd-step" aria-label="Previous preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 2 4 6l4 4"/></svg>
        </button>
        <div class="pd-text">
          <span id="preset-cat" class="pd-label">PRESET</span>
          <span id="preset-name" class="pd-name"></span>
        </div>
        <button id="preset-next" type="button" class="pd-step" aria-label="Next preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg>
        </button>
      </div>
      <div class="preset-actions">
        <button id="preset-save" type="button" class="pd-btn">SAVE</button>
        <button id="preset-load" type="button" class="pd-btn">LOAD</button>
        <button id="preset-folder" type="button" class="pd-btn" title="Open the preset folder">FOLDER</button>
      </div>
      <div class="history">
        <button id="undo-btn" type="button" class="pd-btn icon" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button id="redo-btn" type="button" class="pd-btn icon" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
        <button id="ab-a" type="button" class="pd-btn ab" title="Compare: setting A">A</button>
        <button id="ab-b" type="button" class="pd-btn ab" title="Compare: setting B">B</button>
        <button id="ab-copy" type="button" class="pd-btn ab-copy" title="Copy the current setting to the other slot">A&#8594;B</button>
      </div>
      <div class="top-controls">
        <label class="input-pick web-only">
          <span class="ctl-label">INPUT</span>
          <select id="input-select"><option value="tone">Test: sine bass</option></select>
        </label>
        <label class="tempo-pick web-only" title="Tempo for the synced LFO (the plugin takes the host's)">
          <span class="ctl-label">BPM</span>
          <input id="tempo-input" type="number" min="20" max="300" step="0.1" value="120">
        </label>
        <span class="indicator tempo" title="Host transport"><span class="led" id="play-led"></span><span id="bpm-readout">120</span></span>
        <span class="indicator" title="A MIDI note (retrigger / key tracking)"><span class="led" id="midi-led"></span>MIDI</span>
        <button id="retrig-btn" type="button" class="pd-btn retrig" title="Restart the LFO from phase 0">RETRIG</button>
      </div>
    </header>

    <section class="browser" aria-label="Presets">
      <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
      <div class="preset-grid" id="preset-grid"></div>
    </section>

    <section class="scope-strip">
      <canvas id="scope" class="scope" width="1180" height="96" aria-label="LFO and cutoff display"></canvas>
    </section>

    <nav class="page-tabs" role="tablist" aria-label="Sections">
      <button type="button" class="page-tab" data-page="wobble" role="tab"><span class="led" id="wobble-led"></span>WOBBLE</button>
      <button type="button" class="page-tab" data-page="bands" role="tab"><span class="led" id="bands-led"></span>BANDS · DRIVE</button>
      <button type="button" class="page-tab" data-page="source" role="tab"><span class="led" id="source-led"></span>SOURCE</button>
      <button type="button" class="page-tab" data-page="output" role="tab"><span class="led" id="output-led"></span>OUTPUT</button>
      <span class="page-hint" id="page-hint"></span>
    </nav>
    <div class="pages">
      <div class="page" data-page="wobble">
        <section class="row wobble-row" id="wobble-row"></section>
      </div>
      <div class="page" data-page="bands">
        <section class="row bands-row-1" id="bands-row-1"></section>
        <section class="row bands-row-2" id="bands-row-2"></section>
      </div>
      <div class="page" data-page="source">
        <section class="row source-row" id="source-row"></section>
      </div>
      <div class="page" data-page="output">
        <section class="row output-row" id="output-row"></section>
      </div>
    </div>

    <footer class="statusbar">
      <span id="monitor" class="monitor">Connecting to plugin…</span>
      <span class="audio-status"><span class="led" id="audio-led"></span><span id="audio-info">—</span></span>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <input id="modal-input" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="pd-btn">CANCEL</button>
        <button id="modal-ok" type="button" class="pd-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="js/params.js"></script>
  <script src="js/engine-juce.js"></script>
  <script src="js/knob.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/scope.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
