  Open in Chrome or Edge (works straight from disk with the built-in test sources; start.bat serves it for the
  lower-latency AudioWorklet path and the microphone / tab / file inputs).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>I Wub You v1.0.1</title>
  <style>
/* ===========================================================================
   I Wub You: a deep-blue chassis with a darker control plate let into it,
   steel-blue hardware, orange lamps and value arcs, red for what is live:
   the filter cutoff, pointers, the wobble lamps and anything dangerous.
   Every colour is a token below; the class names belong to the widgets
   (knob.js, controls.js, scope.js) and to app.js, so a restyle stays here.
   Lettering: Bahnschrift (condensed, like an engraved panel) for labels and
   buttons, Segoe UI for prose, Cascadia Mono for readouts.
   =========================================================================== */
:root {
  --bg: #050912;
  --chassis-1: #142a5a;           /* blue chassis */
  --chassis-2: #0a1733;
  --chassis-edge: #2c4f96;
  --plate: #0a1224;               /* control plate */
  --plate-2: #070d1c;
  --plate-edge: #1c3263;
  --panel: #0f1d3b;               /* panels */
  --panel-2: #142751;
  --panel-edge: #23407a;
  --panel-edge-hi: #3a62b5;
  --screen: #03060e;
  --text: #e9effc;
  --muted: #8ea4cf;
  --faint: #4b6396;
  --blue: #3b82ff;                /* secondary accent: tracks, right-channel traces */
  --blue-hi: #7fb0ff;
  --accent: #ff8c2a;              /* orange: lamps, value arcs, the active tab */
  --accent-hi: #ffc48a;
  --accent-glow: rgba(255, 140, 42, 0.45);
  --accent-dim: #9a4f12;
  --accent-bg: #2a1a0a;
  --red: #ff3b3b;                 /* highlights: pointers, cutoff, wobbling lamps, danger */
  --red-hi: #ff8a8a;
  --red-glow: rgba(255, 59, 59, 0.45);
  --red-dim: #7a1c1c;
  --track: #16264a;
  --danger: #ff8a8a;
  --danger-bg: #2c1010;
  --danger-edge: #6a2222;
  --ok: #8cc28f;
  --scope-grid: #16264a;
  --scope-sweep: rgba(59, 130, 255, 0.16);
  --scope-band: rgba(255, 140, 42, 0.08);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --label: "Bahnschrift", "Segoe UI Variable Small", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1400px 700px at 50% -20%, #0f2150 0%, var(--bg) 60%) var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }

/* the console is laid out at a fixed size and scaled to fit the window (app.js fit()) */
.synth {
  position: absolute; left: 50%; top: 12px; transform-origin: top center;
  width: 1240px;
  /* brushed blue steel: a fine horizontal grain over a gradient, a lit top edge */
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(2deg, rgba(160, 200, 255, 0.035) 0 2px, transparent 2px 13px),
    linear-gradient(180deg, #1a3570 0%, var(--chassis-1) 28%, var(--chassis-2) 100%);
  border: 1px solid var(--chassis-edge);
  border-radius: 14px;
  padding: 14px 18px 16px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(170, 200, 255, 0.22),
              inset 0 0 0 3px rgba(10, 20, 50, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column; gap: 10px;
  user-select: none;
}

/* ------------------------------------------------------------- lettering --- */
.ctl-label, .panel-title, .knob-label, .pd-label, .indicator, .cat-tab, .page-tab, .seg button, .power, .pd-btn,
.phase-tag, .modal-title, .strip-title, .meter-db, .sub-title, .detected {
  font-family: var(--label); font-stretch: semi-condensed;
}
.ctl-label, .knob-label, .pd-label {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600;
}
.panel-title { font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); font-weight: 700; white-space: nowrap; }

/* ---------------------------------------------------------------- lamps --- */
.led {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #141f3a;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.7), 0 0 0 1.5px #050a16, 0 0 0 2.5px #22365f;
  flex: none; transition: background 60ms, box-shadow 60ms;
}
.led.on, .power.on .led {
  background: radial-gradient(circle at 40% 35%, #ffe0b8, var(--accent) 55%, #c9641c);
  box-shadow: 0 0 0 1.5px #050a16, 0 0 0 2.5px #22365f, 0 0 9px var(--accent-glow), 0 0 3px var(--accent);
}
.led.red.on, .power.wob.on .led {
  background: radial-gradient(circle at 40% 35%, #ffd0d0, var(--red) 55%, #b01c1c);
  box-shadow: 0 0 0 1.5px #050a16, 0 0 0 2.5px #22365f, 0 0 9px var(--red-glow), 0 0 3px var(--red);
}

/* -------------------------------------------------------------- top bar --- */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; padding: 0 2px; }
.brand { display: flex; align-items: center; gap: 10px; line-height: 1.1; flex: none; }
.brand-logo { width: 40px; height: 34px; flex: none; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6)); }
.brand-logo .bl-wave { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
.brand-logo .bl-wave2 { fill: none; stroke: var(--blue-hi); stroke-width: 1.6; stroke-linecap: round; opacity: 0.8; }
.brand-logo .bl-dot { fill: var(--red); }
.brand-text { display: flex; flex-direction: column; white-space: nowrap; }
.brand-mark {
  font-family: var(--label); font-size: 20px; font-weight: 700; letter-spacing: 0.22em;
  background: linear-gradient(180deg, #fff3e4 0%, var(--accent-hi) 45%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.55));
}
.brand-sub { font-family: var(--label); font-stretch: semi-condensed; font-size: 8.5px; letter-spacing: 0.24em; color: var(--muted); margin-top: 3px; }

/* the preset display: an orange LCD behind glass */
.patch-display {
  position: relative; flex: 1; min-width: 120px; height: 36px; display: flex; align-items: center; gap: 4px;
  background: linear-gradient(180deg, #020408, #060b16 40%, #030610); border: 1px solid #000; border-radius: 6px; padding: 3px 4px;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(170, 200, 255, 0.08);
}
.patch-display::after {
  content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px);
}
.pd-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; line-height: 1.1; }
.pd-label { font-size: 8px; color: #9a5a1f; letter-spacing: 0.2em; }
.pd-name {
  font-family: var(--mono); color: var(--accent); font-size: 14px; font-weight: 600; text-shadow: 0 0 10px var(--accent-glow);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pd-step {
  flex: none; width: 24px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #1a2d58, #0f1c3a); border: 1px solid #22386a; border-radius: 4px; cursor: pointer;
}
.pd-step svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pd-step:hover svg { stroke: var(--accent); }
.pd-step:active { transform: translateY(1px); }

/* buttons: dark blue bakelite with a lit top edge; groups are joined into one bar */
.pd-btn {
  background: linear-gradient(180deg, #27437f 0%, #182e5e 60%, #122449 100%); border: 1px solid #0a1430; border-radius: 5px;
  height: 28px; padding: 0 11px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--text); cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(170, 200, 255, 0.16), 0 1px 2px rgba(0, 0, 0, 0.6);
}
.pd-btn:hover { background: linear-gradient(180deg, #30529a, #1d3870 60%, #162b58); }
.pd-btn:active { box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6); transform: translateY(1px); }
.pd-btn:disabled { opacity: 0.35; cursor: default; }
.pd-btn.primary { background: linear-gradient(180deg, #5a3110, #351c08); border-color: var(--accent-dim); color: var(--accent); }
.pd-btn.primary:hover { border-color: var(--accent); }
.pd-btn.danger { background: var(--danger-bg); border-color: var(--danger-edge); color: var(--danger); }
.preset-actions, .history { display: flex; }
.preset-actions .pd-btn, .history .pd-btn { border-radius: 0; margin-left: -1px; }
.preset-actions .pd-btn:first-child, .history .pd-btn:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
.preset-actions .pd-btn:last-child, .history .pd-btn:last-child { border-radius: 0 5px 5px 0; }
.pd-btn.icon { padding: 0 8px; font-size: 14px; letter-spacing: 0; font-family: var(--sans); }
.pd-btn.ab { padding: 0 9px; }
.pd-btn.ab.on { color: var(--accent); background: linear-gradient(180deg, #4a2c10, #2f1d0c); box-shadow: inset 0 0 0 1px var(--accent-dim), inset 0 1px 6px rgba(0, 0, 0, 0.5); }
.pd-btn.ab-copy { padding: 0 8px; font-size: 10px; }
.pd-btn.small { height: 22px; padding: 0 9px; font-size: 9.5px; }
.pd-btn.retrig { background: linear-gradient(180deg, #6a1c1c, #3a1010); border-color: #1a0606; color: var(--red-hi); }
.pd-btn.retrig:hover { background: linear-gradient(180deg, #7e2323, #461414); }
.top-controls { display: flex; align-items: center; gap: 8px; flex: none; }
.input-pick, .tempo-pick { display: flex; align-items: center; gap: 6px; }
.input-pick select, .tempo-pick input { background: var(--screen); color: var(--text); border: 1px solid var(--panel-edge); border-radius: 5px; padding: 5px 6px; font: 11px var(--sans); max-width: 150px; }
.tempo-pick input { width: 56px; font-family: var(--mono); color: var(--accent); }
/* the web build adds the INPUT picker and the BPM field: drop the INPUT label and the BPM readout (the field shows it) */
body.web .input-pick .ctl-label, body.web .indicator.tempo { display: none; }
body:not(.web) .web-only { display: none; }
.indicator { display: flex; align-items: center; gap: 6px; font-size: 9.5px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
#bpm-readout { font-family: var(--mono); color: var(--text); letter-spacing: 0; }

/* ======================================================== preset browser === */
.browser {
  background: linear-gradient(180deg, #0c172f, #091226); border: 1px solid #060c1a; border-radius: 8px; padding: 4px 8px 8px;
  display: flex; flex-direction: column; gap: 7px;
  box-shadow: inset 0 1px 0 rgba(170, 200, 255, 0.04), inset 0 2px 8px rgba(0, 0, 0, 0.5);
}
.cat-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid #1a2c55; }
.cat-tab {
  position: relative; background: transparent; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 6px 10px 4px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); cursor: pointer;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.cat-tab.has-current::after { content: ""; position: absolute; top: 5px; right: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--red); box-shadow: 0 0 4px var(--red-glow); }
/* 16 presets per category: 8 columns x 2 rows, all visible; more (user presets) scroll */
.preset-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-auto-rows: 30px; gap: 5px; height: 65px; overflow-y: auto; padding-right: 2px; }
.preset-btn {
  position: relative; display: flex; align-items: center; padding: 0 18px 0 10px;
  background: linear-gradient(180deg, #152a56, #0f1f42); border: 1px solid #22386a; border-radius: 4px;
  font-size: 11px; font-weight: 600; text-align: left; cursor: pointer; min-width: 0; color: var(--muted);
  box-shadow: inset 0 1px 0 rgba(170, 200, 255, 0.05);
}
.preset-btn::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 0 2px 2px 0; background: transparent; }
.preset-btn:hover { border-color: var(--panel-edge-hi); color: var(--text); }
.preset-btn:active { transform: translateY(1px); }
.preset-btn.selected { border-color: var(--accent-dim); background: linear-gradient(180deg, #3a2410, #2a1a0c); color: var(--accent-hi); }
.preset-btn.selected::before { background: var(--red); box-shadow: 0 0 6px var(--red-glow); }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-del { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; line-height: 17px; text-align: center; border-radius: 4px; color: var(--muted); font-size: 14px; opacity: 0; }
.preset-btn:hover .pb-del { opacity: 1; }
.pb-del:hover { background: #3c1414; color: var(--danger); }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / 3; align-self: center; font-size: 11px; color: var(--muted); line-height: 1.5; padding: 0 4px; }
.path { font-family: var(--mono); color: var(--text); font-size: 11px; word-break: break-all; }
.preset-grid::-webkit-scrollbar { width: 6px; }
.preset-grid::-webkit-scrollbar-thumb { background: #2c4a86; border-radius: 3px; }

/* ================================================================ scope ==== */
.scope-strip {
  background: linear-gradient(180deg, #030711, #050a18); border: 1px solid #000; border-radius: 8px; padding: 6px 10px 4px;
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(170, 200, 255, 0.07);
}
.scope { display: block; width: 100%; height: 96px; }

/* ================================================= page tabs + the plate === */
.page-tabs { display: flex; align-items: flex-end; gap: 3px; padding: 0 10px; margin-bottom: -1px; position: relative; z-index: 1; }
.page-tab {
  display: flex; align-items: center; gap: 7px; border: 1px solid #060c1a; border-bottom: none; border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, #152a56, #0f1f42); padding: 7px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
  color: var(--muted); cursor: pointer; white-space: nowrap; flex: none; box-shadow: inset 0 1px 0 rgba(170, 200, 255, 0.08);
}
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); background: var(--plate); border-color: var(--plate-edge); padding-bottom: 8px; box-shadow: none; }
.page-hint { margin-left: auto; font-family: var(--sans); font-size: 10px; color: var(--muted); opacity: 0.85; letter-spacing: 0.02em; padding: 0 4px 7px 10px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the plate: dark blue, let into the chassis; every page fills it */
.pages {
  display: grid; padding: 12px; border: 1px solid var(--plate-edge); border-radius: 8px;
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.012) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 0%, var(--plate) 0%, var(--plate-2) 100%);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(170, 200, 255, 0.07);
  min-height: 300px;
}
.page { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.page:not(.active) { visibility: hidden; pointer-events: none; }

/* --------------------------------------------------------------- panels --- */
.row { display: grid; gap: 12px; flex: 1 1 auto; }
.wobble-row { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.3fr); }
.bands-row-1 { grid-template-columns: minmax(0, 1fr); }
.bands-row-2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.source-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); }
.output-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 0.9fr); }
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--panel-edge); border-radius: 8px;
  padding: 9px 12px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  box-shadow: inset 0 1px 0 rgba(170, 200, 255, 0.07), 0 2px 6px rgba(0, 0, 0, 0.45); transition: opacity 150ms;
}
.panel.off .knob-row, .panel.off .field-grid, .panel.off .switch-row, .panel.off .seg { opacity: 0.4; }
.panel.inactive { opacity: 0.45; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px;
  padding-bottom: 6px; border-bottom: 1px solid rgba(170, 200, 255, 0.08);
}
.panel-head .seg, .panel-head .param-select { flex: none; }
.panel-head .param-select { width: auto; min-width: 120px; }
.panel-head .head-group { display: flex; align-items: center; gap: 8px; min-width: 0; margin-left: auto; }
.phase-tag {
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--faint); border: 1px solid var(--panel-edge);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap;
}
.power {
  display: flex; align-items: center; gap: 7px; background: linear-gradient(180deg, #0c1730, #081024); border: 1px solid #050a16; border-radius: 4px;
  padding: 3px 9px 3px 7px; font-size: 10px; letter-spacing: 0.14em; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(170, 200, 255, 0.06);
}
.power:hover { color: var(--text); }
.power.on { color: var(--accent-hi); }
.power.wob.on { color: var(--red-hi); }
.panel-note { font-size: 10.5px; color: var(--muted); line-height: 1.5; }
.sub-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-top: 4px; border-top: 1px solid rgba(170, 200, 255, 0.08); }
.panel-note b { color: var(--text); font-weight: 600; }
.detected { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.detected b { color: var(--accent); font-weight: 700; font-family: var(--mono); letter-spacing: 0; }
.detected b.hot { color: var(--red-hi); text-shadow: 0 0 6px var(--red-glow); }
.mini-meter { width: 44px; height: 6px; background: #03060e; border: 1px solid #000; border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8); }
.mini-meter > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 60ms linear; }

/* ---------------------------------------------------------------- knobs --- */
.knob-row { display: flex; justify-content: space-around; align-items: flex-start; align-content: center; gap: 0; flex-wrap: wrap; flex: 1 1 auto; }
.knob-row.left { justify-content: flex-start; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 60px; }
.knob-svg { width: 56px; height: 56px; cursor: ns-resize; touch-action: none; outline: none; overflow: visible; }
.knob-svg:focus-visible .k-face { stroke: var(--accent); }
.k-track { fill: none; stroke: var(--track); stroke-width: 3.5; stroke-linecap: round; }
.k-value { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.k-tick { fill: var(--faint); }
.k-face { fill: url(#knobFace); stroke: url(#knobRim); stroke-width: 2; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.65)); }
.k-pointer { stroke: var(--red); stroke-width: 2.6; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--red-glow)); }
.knob:hover .k-track { stroke: #22386a; }
.knob-value { font-family: var(--mono); font-size: 11px; color: var(--text); min-height: 14px; white-space: nowrap; }
.knob.active .knob-value { color: var(--accent); text-shadow: 0 0 6px var(--accent-glow); }
.knob-label { font-size: 9px; letter-spacing: 0.08em; white-space: nowrap; }

/* -------------------------------------------------- switches / choices ---- */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.switch-row.left { justify-content: flex-start; gap: 10px; }
.seg {
  display: inline-flex; background: #070d1c; border: 1px solid #040812; border-radius: 5px; padding: 2px; gap: 2px; flex-wrap: wrap;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(170, 200, 255, 0.06);
}
.seg button { background: transparent; border: none; border-radius: 3px; padding: 4px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.seg button:not(:disabled):hover { color: var(--text); }
.seg button:disabled { opacity: 0.3; cursor: default; }

  <script>
// ============================================================================
//  Parameter definitions. Must match vst/Source/Params.h exactly (IDs, ranges,
//  defaults, skew, choice lists, ORDER); tests/check-params.ps1 compares them.
//  New parameters are only appended. The web build is generated from this file.
// ============================================================================
'use strict';

const SOURCES = ['Auto', 'Bass', 'Vocal', 'Guitar', 'Drums', 'Pad', 'Full Mix'];
const HARM_MODES = ['Auto', 'Always'];
const HARM_SHAPES = ['Shaper', 'Saw', 'Square'];
const BANDS = ['Single', '3-Band'];
const OVERSAMPLE = ['1x', '2x', '4x'];
const DRIVE_POS = ['Pre Filter', 'Post Filter'];
const FILTER_TYPES = ['Low-pass', 'Band-pass', 'High-pass', 'Notch', 'Formant'];
const LFO_SHAPES = ['Sine', 'Triangle', 'Saw Down', 'Saw Up', 'Square', 'Sample & Hold', 'Smooth Random'];
const LFO_DIVS = ['1/1', '1/2', '1/2T', '1/4', '1/4D', '1/4T', '1/8', '1/8D', '1/8T', '1/16', '1/16D', '1/16T', '1/32'];
const LFO_DIV_BEATS = [4, 2, 4 / 3, 1, 1.5, 2 / 3, 0.5, 0.75, 1 / 3, 0.25, 0.375, 1 / 6, 0.125];
const LFO_RETRIGS = ['Off', 'MIDI Note'];
const STEREO_MODES = ['Stereo', 'Mono Sum', 'Mid-Side'];
const BAND_IDS = ['lo', 'mid', 'hi'];
const BAND_NAMES = ['Low', 'Mid', 'High'];

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function midiNoteName(n) { return NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1); }

// ---- builders (same shapes as Params.h) ----------------------------------------
const P = (id, name, group, min, max, def, unit, extra) =>
  Object.assign({ id, name, group, type: 'float', min, max, def, unit: unit || '' }, extra || {});
const L = (id, name, group, min, max, def, unit) => P(id, name, group, min, max, def, unit, { skew: 'log' });
const B = (id, name, group, def) => ({ id, name, group, type: 'bool', min: 0, max: 1, step: 1, def: def ? 1 : 0, unit: '' });
const C = (id, name, group, choices, def) =>
  ({ id, name, group, type: 'choice', min: 0, max: choices.length - 1, step: 1, def, choices, unit: '' });

// the five controls of one band strip
function bandParams(b) {
  const id = BAND_IDS[b], name = BAND_NAMES[b];
  return [
    B(`${id}Wob`, `${name} Wobble`, 'band', b !== 2 ? 1 : 0),
    P(`${id}Depth`, 'Depth', 'band', 0, 1, 1, '%'),
    P(`${id}Drive`, 'Drive', 'band', 0, 1, 0.3, '%'),
    P(`${id}Tone`, 'Tone', 'band', 0, 1, 0.7, '%'),
    P(`${id}Level`, 'Level', 'band', -24, 12, 0, 'dB'),
  ];
}
// band 0 low, 1 mid, 2 high; field: wob | depth | drive | tone | level
function bandId(band, field) { return BAND_IDS[band] + field[0].toUpperCase() + field.slice(1); }

const PARAM_DEFS = [
  // ---- input
  C('source', 'Source Type', 'input', SOURCES, 0),
  B('autoIn', 'Auto Gain', 'input', 1),
  P('inGain', 'Input', 'input', -24, 24, 0, 'dB'),
  // ---- harmonics (phase 2)
  B('harmOn', 'Harmonics', 'harm', 0),
  C('harmMode', 'Mode', 'harm', HARM_MODES, 0),
  C('harmShape', 'Shape', 'harm', HARM_SHAPES, 0),
  P('harmAmount', 'Amount', 'harm', 0, 1, 0.5, '%'),
  B('subOn', 'Sub Octave', 'harm', 0),
  P('subAmount', 'Sub', 'harm', 0, 1, 0.5, '%'),
  // ---- bands
  C('bands', 'Bands', 'bands', BANDS, 0),
  L('xLow', 'X-Over Low', 'bands', 60, 1000, 200, 'Hz'),
  L('xHigh', 'X-Over High', 'bands', 800, 12000, 2500, 'Hz'),
  C('os', 'Oversampling', 'bands', OVERSAMPLE, 1),
  C('drivePos', 'Drive Position', 'bands', DRIVE_POS, 0),
  ...bandParams(0), ...bandParams(1), ...bandParams(2),
  // ---- wobble filter
  C('filterType', 'Filter', 'filter', FILTER_TYPES, 0),
  L('cutoffLo', 'Cutoff Low', 'filter', 20, 20000, 120, 'Hz'),
  L('cutoffHi', 'Cutoff High', 'filter', 20, 20000, 4000, 'Hz'),
  P('reso', 'Resonance', 'filter', 0, 1, 0.5, '%'),
  P('resoLimit', 'Reso Limit', 'filter', 0, 1, 0.5, '%'),
  P('keyTrack', 'Key Track', 'filter', 0, 1, 0, '%'),
  // ---- LFO
  C('lfoShape', 'Shape', 'lfo', LFO_SHAPES, 0),
  B('lfoSync', 'Sync', 'lfo', 1),
  L('lfoRate', 'Rate', 'lfo', 0.05, 20, 2, 'lfohz'),
  C('lfoDiv', 'Division', 'lfo', LFO_DIVS, 6),
  P('lfoPhase', 'Phase', 'lfo', 0, 360, 0, 'deg'),
  P('lfoStereo', 'Stereo', 'lfo', 0, 180, 0, 'deg'),
  P('lfoSmooth', 'Smooth', 'lfo', 0, 1, 0.1, '%'),
  C('lfoRetrig', 'Retrigger', 'lfo', LFO_RETRIGS, 0),
  // ---- transient preserve (phase 2)
  P('transPreserve', 'Transients', 'trans', 0, 1, 0, '%'),
  // ---- stereo
  C('stereoMode', 'Stereo Mode', 'stereo', STEREO_MODES, 0),
  P('monoBelow', 'Mono Below', 'stereo', 0, 300, 0, 'Hz'),
  // ---- output
  P('duck', 'Duck', 'output', 0, 1, 0, '%'),
  P('mix', 'Mix', 'output', 0, 1, 1, '%'),
  P('outGain', 'Output', 'output', -24, 24, 0, 'dB'),
  B('autoOut', 'Auto Output', 'output', 0),
  B('limiter', 'Limiter', 'output', 1),
];

const PARAM_BY_ID = Object.fromEntries(PARAM_DEFS.map(d => [d.id, d]));

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function defaultParamValues() {
  return Object.fromEntries(PARAM_DEFS.map(d => [d.id, d.def]));
}

// value <-> 0..1 normalized (same mapping the VST host sees)
function paramToNorm(d, v) {
  if (d.skew === 'log') return clamp(Math.log(v / d.min) / Math.log(d.max / d.min), 0, 1);
  return clamp((v - d.min) / (d.max - d.min), 0, 1);
}

function paramFromNorm(d, n) {
  n = clamp(n, 0, 1);
  let v = d.skew === 'log' ? d.min * Math.pow(d.max / d.min, n) : d.min + n * (d.max - d.min);
  if (d.step) v = Math.round(v / d.step) * d.step;
  return clamp(v, d.min, d.max);
}

function formatParam(d, v) {
  if (d.type === 'choice') return d.choices[clamp(Math.round(v), 0, d.choices.length - 1)];
  if (d.type === 'bool') return v >= 0.5 ? 'On' : 'Off';
  const sgn = (x) => (x > 0 ? '+' : '');
  switch (d.unit) {
    case 's':     return v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`;
    case 'Hz':    if (d.id === 'monoBelow' && v < 1) return 'Off';
                  return v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 1 : 2)} kHz` : `${Math.round(v)} Hz`;
    case 'lfohz': return `${v.toFixed(v < 1 ? 3 : v < 10 ? 2 : 1)} Hz`;
    case 'st':    return `${sgn(v)}${Math.round(v)} st`;
    case 'ct':    return `${sgn(v)}${Math.round(v)} ct`;
    case '%':     return `${Math.round(v * 100)}%`;
    case 'bip':   return `${v > 0.004 ? '+' : ''}${Math.round(v * 100)}%`;
    case 'dB':    return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB`;
    case 'deg':   return `${Math.round(v)}°`;
    case 'ms':    return `${Math.round(v)} ms`;
    case 'count': return String(Math.round(v));
    case 'note':  return midiNoteName(Math.round(v));
    case 'oct':   return `${v > 0.005 ? '+' : ''}${v.toFixed(1)} oct`;
    default:      return v.toFixed(2);
  }
}

</script>

<script>
// ============================================================================
//  Factory presets for the web build: resolves vst/presets/factory_presets.json
//  exactly like PresetManager::loadFactory (C++):
//    preset values = parameter defaults <- template chain (base first) <- own params
//  Values are clamped to the parameter range (not rounded), like applyParamObject.
//  Also: the preset-file migration steps (twin of PresetManager::migrate) and the
//  source types' defaults (what picking a type loads), taken from the srcBass ..
//  srcMix templates (the C++ tests keep those equal to dsp/Sources.h).
//  Needs params.js (PARAM_BY_ID, clamp).
// ============================================================================
'use strict';

const WUB_PRESET_VERSION = 1;
const WUB_PRESET_FORMAT = 'I Wub You Preset';
const WUB_PRESET_EXT = '.wubpreset';

// Copies every known { paramId: number } into out. Returns how many were found.
function wubApplyParamObject(obj, out) {
  let found = 0;
  if (!obj || typeof obj !== 'object') return 0;
  for (const id of Object.keys(obj)) {
    const d = PARAM_BY_ID[id];
    const raw = obj[id];
    if (!d || d.noPreset || !(typeof raw === 'number' || typeof raw === 'boolean')) continue;
    out[id] = clamp(Number(raw), d.min, d.max);
    ++found;
  }
  return found;
}

// Resolves a template chain into out (base first, then the template's own params).
function wubApplyTemplate(templates, name, out, depth) {
  if (!name || depth > 8) return;
  const t = templates[name];
  if (!t || typeof t !== 'object') { console.warn(`unknown preset template "${name}"`); return; }
  wubApplyTemplate(templates, t.base, out, depth + 1);
  wubApplyParamObject(t.params, out);
}

// [{ name, category, values }] where values holds only what the template chain + preset set.
function wubFactoryPresets(json) {
  const templates = (json && json.templates) || {};
  const list = [];
  for (const cat of (json && json.categories) || []) {
    for (const p of cat.presets || []) {
      const values = {};
      wubApplyTemplate(templates, p.base, values, 0);
      wubApplyParamObject(p.params, values);
      list.push({ name: String(p.name), category: String(cat.name), values });
    }
  }
  if (!list.length) list.push({ name: 'Init', category: 'Factory', values: {} });
  return list;
}

// What picking a source type loads (PluginProcessor::applySourceType): the type and its
// defaults, read from that type's factory template. Twin of kSourceKeys in dsp/Sources.h.
const WUB_SOURCE_TEMPLATES = ['srcBass', 'srcVocal', 'srcGuitar', 'srcDrums', 'srcPad', 'srcMix'];
const WUB_SOURCE_KEYS = ['bands', 'cutoffLo', 'cutoffHi', 'reso', 'loWob', 'midWob', 'hiWob', 'loDrive', 'midDrive', 'hiDrive',
                         'xLow', 'xHigh', 'filterType', 'monoBelow', 'transPreserve', 'harmOn', 'harmAmount'];
function wubSourceDefaults(json, type) {
  type = clamp(Math.round(type), 0, 6);
  const out = { source: type };
  if (type === 0) return out;   // Auto: nothing to load (phase 2 analyses the input)
  const all = {};
  wubApplyTemplate((json && json.templates) || {}, WUB_SOURCE_TEMPLATES[type - 1], all, 0);
  for (const k of WUB_SOURCE_KEYS) if (all[k] !== undefined) out[k] = all[k];
  return out;
}

// Brings a preset object written by an older version up to WUB_PRESET_VERSION (in place).
// Same steps as PresetManager::migrate. Plain parameter additions need no step.
function wubMigratePreset(json) {
  if (!json || typeof json !== 'object') return json;
  let version = Number.isFinite(Number(json.version)) ? Math.trunc(Number(json.version)) : 1;
  version = Math.max(version, 1);
  // while (version < WUB_PRESET_VERSION) { switch (version) { case 1: /* 1 -> 2 */ break; } ++version; }
  if (version < WUB_PRESET_VERSION) version = WUB_PRESET_VERSION;
  json.version = version;
  return json;
}

// ============================================================================
//  I Wub You DSP engine: JavaScript twin of vst/Source/WubEngine.h and
//  vst/Source/dsp/*.h. Kept line-for-line equivalent (same control rate, same

//  build by vst/tests/run-parity.ps1 (tolerance 1e-4).

//  This whole function is stringified and loaded as an AudioWorklet module
//  (or run on the main thread as a ScriptProcessor fallback), so it must not
//  reference anything outside itself.
//

//  float parameters. Nothing allocates on the audio path.

function wubWorkletModule() {

  class Biquad {

    copyCoefs(o) { this.b0 = o.b0; this.b1 = o.b1; this.b2 = o.b2; this.a1 = o.a1; this.a2 = o.a2; }
    setLowpass(f0, q, sr) {

      const w = kTwoPi * f0 / sr, alpha = Math.sin(w) / (2 * q), cw = Math.cos(w), a0 = 1 + alpha;
      this.b0 = (1 + cw) / 2 / a0; this.b1 = -(1 + cw) / a0; this.b2 = this.b0;

  class Svf {

      const v2 = this.ic2 + a2 * this.ic1 + a3 * v3;
      this.ic1 = 2 * v1 - this.ic1;
      this.ic2 = 2 * v2 - this.ic2;
      this.lp = v2;
      this.bp = v1 * k;
      this.hp = x - k * v1 - v2;
      this.notch = x - k * v1;

  const resoToQ = (reso) => 0.5 * Math.pow(10, clampd(reso, 0, 1) * 1.60206);

  const kNumVowels = 5;
  const kFormantHz = [[800, 1150, 2900], [400, 1600, 2700], [350, 1700, 2700], [450, 800, 2830], [325, 700, 2700]];
  const kFormantAmp = [[1.0, 0.63, 0.10], [1.0, 0.25, 0.03], [1.0, 0.20, 0.03], [1.0, 0.50, 0.05], [1.0, 0.30, 0.03]];

  class Lr4 {
    constructor() { this.lp1 = new Biquad(); this.lp2 = new Biquad(); this.hp1 = new Biquad(); this.hp2 = new Biquad(); this.lo = 0; this.hi = 0; }

    constructor() { this.x1 = 0; this.y1 = 0; this.r = 0.9993; }
    prepare(sr) { this.r = 1 - kTwoPi * 5 / sr; this.x1 = this.y1 = 0; }
    process(x) { const y = x - this.x1 + this.r * this.y1; this.x1 = x; this.y1 = y; return y; }

    constructor() { this.env = 0; this.aUp = 1; this.aDown = 0.01; }
    prepare(attackSec, releaseSec, sr) { this.aUp = tauCoef(attackSec, 1 / sr); this.aDown = tauCoef(releaseSec, 1 / sr); this.env = 0; }

    prepare(windowSec, sr) { this.a = tauCoef(windowSec, 1 / sr); this.ms = 0; }

  class DelayLine {
    constructor() { this.buf = new Float64Array(16); this.pos = 0; }
    reset() { this.buf.fill(0); this.pos = 0; }

      this.pos = (this.pos + 1) & 15;

  // =================================================== dsp/Oversampler.h ===
  class HalfbandDesign {
    constructor(numCoefs, transition) {
      this.n = numCoefs;

      const n = this.n, order = n * 2 + 1;
      let k = Math.tan((1 - 2 * transition) * kPi / 4);

      const e = 0.5 * (1 - kk) / (1 + kk);
      const e4 = e * e * e * e;
      const q = e * (1 + e4 * (2 + e4 * (15 + 150 * e4)));
      for (let idx = 0; idx < n; idx++) {
        const cc = idx + 1;
        let num = 0, den = 0, t;
        let i = 0, j = 1;
        do { t = Math.pow(q, i * (i + 1)) * Math.sin((i * 2 + 1) * cc * kPi / order) * j; num += t; j = -j; i++; } while (Math.abs(t) > 1e-100);
        num *= Math.pow(q, 0.25);
        i = 1; j = -1;
        do { t = Math.pow(q, i * i) * Math.cos(i * 2 * cc * kPi / order) * j; den += t; j = -j; i++; } while (Math.abs(t) > 1e-100);
        den += 0.5;
        const ww = num / den, w2 = ww * ww;
        const x = Math.sqrt((1 - w2 * k) * (1 - w2 / k)) / (1 + w2);

  const halfbandB = new HalfbandDesign(4, 0.14);

  class HalfbandState {
    constructor() { this.x = new Float64Array(12); this.y = new Float64Array(12); this.s0 = 0; this.s1 = 0; }
    reset() { this.x.fill(0); this.y.fill(0); }

    run(d) {

      let s0 = this.s0, s1 = this.s1;
      let i = 0;
      for (; i + 1 < d.n; i += 2) {
        const t0 = (s0 - y[i]) * c[i] + x[i];
        const t1 = (s1 - y[i + 1]) * c[i + 1] + x[i + 1];
        x[i] = s0; x[i + 1] = s1;
        y[i] = t0; y[i + 1] = t1;
        s0 = t0; s1 = t1;
      }

    up(d, inp) { this.s0 = inp; this.s1 = inp; this.run(d); }

    down(d, in0, in1) {

      this.run(d);

    constructor() { this.x1 = 0; }
    reset() { this.x1 = 0; }
    static f(x) { return 4 * Math.tanh(0.25 * x); }
    static F(x) { const a = Math.abs(x); return 16 * (0.25 * a + Math.log(1 + Math.exp(-0.5 * a)) - 0.6931471805599453); }

    }
    reset() { this.upA.reset(); this.upB.reset(); this.downA.reset(); this.downB.reset(); this.s1.reset(); this.s2.reset(); this.s4.reset(); }

    process(x, osChoice) {

        const y1 = this.s2.process(a1);

      this.upB.up(B, a0);

      this.lastPos = pos;

        case 2: raw = 1 - pos; break;
        case 3: raw = pos; break;
        case 4: raw = pos < 0.5 ? 1 : 0; break;

        case 6: raw = this.rndFrom + (this.rndTo - this.rndFrom) * pos; break;
        default: raw = 0.5 - 0.5 * Math.cos(kTwoPi * pos); break;

    }
  }

  // ========================================================= dsp/Pitch.h ===
  class PitchTracker {
    constructor() {
      this.lp = new Biquad();
      this.ring = new Float64Array(1024);
      this.d = new Float64Array(402);
      this.pos = 0; this.decimCount = 0; this.sinceHop = 0;
      this.filled = 0;
      this.decim = 4;
      this.srDec = 12000;
      this.pitch = 0; this.conf = 0; this.lastLp = 0; this.analysed = false;
    }
    prepare(sr) {
      this.lp.setLowpass(2500, 0.7071067811865476, sr);
      this.lp.reset();
      this.ring.fill(0);
      this.pos = this.decimCount = this.sinceHop = 0;
      this.filled = 0;
      this.decim = Math.trunc(sr / 12000 + 0.5);
      if (this.decim < 1) this.decim = 1;
      this.srDec = sr / this.decim;
      this.pitch = 0; this.conf = 0; this.lastLp = 0; this.analysed = false;
    }
    push(x) {
      const y = this.lp.process(x);
      this.lastLp = y;
      if (++this.decimCount < this.decim) return;
      this.decimCount = 0;
      this.ring[this.pos] = y;
      this.pos = (this.pos + 1) & 1023;
      if (this.filled < 912) this.filled++;
      if (++this.sinceHop >= 256) { this.sinceHop = 0; this.analyse(); }
    }
    analyse() {
      const kWin = 512, kMaxLag = 400, kMinLag = 8, kThreshold = 0.15;
      const ring = this.ring, d = this.d;
      if (this.filled < kWin + kMaxLag) return;
      this.analysed = true;
      const start = (this.pos - (kWin + kMaxLag) + 1024) & 1023;
      let energy = 0;
      for (let i = 0; i < kWin; i++) { const v = ring[(start + i) & 1023]; energy += v * v; }

      }
      return true;
    }
  }

  registerProcessor('i-wub-you', WubProcessor);
}

<script>
// ============================================================================
//  Web host: stands in for the plugin's C++ side when the UI runs in a
//  browser. It provides window.__JUCE__.backend with exactly the events the
//  JUCE editor uses (see PluginEditor.cpp), so vst/ui runs unchanged:
//    audio    Web Audio: AudioWorklet (or ScriptProcessor fallback on file://)
//             running dsp-worklet.js, the JS twin of WubEngine.h
//    input    built-in test sources (sine bass, saw, chord, drum loop, noise:
//             generated inside the engine), the microphone / line-in, a browser
//             tab or the whole screen's audio, or an audio file (looped)
//    tempo    a BPM field (the plugin takes the host's tempo and transport)
//    MIDI     Web MIDI, all inputs: notes retrigger the LFO (Retrigger: MIDI Note)
//    presets  factory (FACTORY_JSON via factory.js), this browser (localStorage),
//             or a linked folder on disk (File System Access API), the same
//             .wubpreset format as the plugin, rescanned every 2 s
//  Needs params.js, factory.js, dsp-worklet.js and FACTORY_JSON loaded first.
// ============================================================================
(function () {
  'use strict';

  // ---------------------------------------------------------- the bridge ---
  const listeners = {};
  const handlers = {};
  const toUi = (ev, data) => queueMicrotask(() => (listeners[ev] || []).forEach(f => f(data)));
  window.__JUCE__ = {
    backend: {
      addEventListener(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
      // handled synchronously so file pickers / permission prompts keep the click's user activation
      emitEvent(ev, data) { const h = handlers[ev]; if (h) h(data || {}); },
    },
  };
  const message = (text) => toUi('message', { text });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  // ------------------------------------------------------ factory presets ---
  const FACTORY = wubFactoryPresets(FACTORY_JSON).map((p, i) =>
    ({ id: `factory:${i}`, name: p.name, category: p.category, factory: true, values: p.values }));

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();
  let current = { id: '', name: '', category: '' };
  let bpm = clamp(Number(store.get('wub.bpm')) || 120, 20, 300);

  // Every preset parameter: the preset's value, else the default (like PluginProcessor::applyPreset).
  // Stepped parameters snap like the plugin's int / choice params.
  function presetValues(pv) {
    const out = {};
    for (const d of PARAM_DEFS) {
      if (d.noPreset) continue;
      let v = Number(pv[d.id]);
      if (pv[d.id] === undefined || pv[d.id] === null || isNaN(v)) v = d.def;
      v = clamp(v, d.min, d.max);
      if (d.step) v = Math.round(v / d.step) * d.step;
      out[d.id] = v;
    }

  }

    const all = presetValues(pv);
    Object.assign(values, all);
    audio.post({ type: 'params', values: all });
    current = info;
    toUi('params', Object.assign({}, values));
    toUi('preset', current);
  }

  Object.assign(values, presetValues(FACTORY[0].values));
  current = { id: FACTORY[0].id, name: FACTORY[0].name, category: FACTORY[0].category };

  // a parameter change made by the host side (source type defaults): the engine and the UI both see it
  function hostSetParam(id, v) {
    const d = PARAM_BY_ID[id];
    if (!d) return;
    v = clamp(Number(v), d.min, d.max);
    if (d.step) v = Math.round(v / d.step) * d.step;
    if (values[id] === v) return;
    values[id] = v;
    audio.post({ type: 'param', id, value: v });
    toUi('params', { [id]: v });
  }

  // ---------------------------------------------------------------- audio ---
  // built-in sources are generated inside the engine (type = TestSource type); the rest feed the worklet's input
  const BUILTIN = [
    { id: 'tone', name: 'Test: sine bass (55 Hz)', type: 1, freq: 55, level: 0.5 },
    { id: 'saw', name: 'Test: saw (110 Hz)', type: 2, freq: 110, level: 0.4 },
    { id: 'chord', name: 'Test: saw chord', type: 4, freq: 110, level: 0.4 },
    { id: 'drums', name: 'Test: drum loop (120 BPM)', type: 6, freq: 0, level: 0.6 },
    { id: 'noise', name: 'Test: white noise', type: 5, freq: 0, level: 0.3 },
  ];
  const LIVE = [
    { id: 'mic', name: 'Microphone / line-in' },
    { id: 'tab', name: 'A browser tab or the screen (share its audio)' },
    { id: 'file', name: 'Audio file (looped)…' },
  ];
  const audio = {
    ctx: null, node: null, port: null, mode: '', error: '', input: store.get('wub.input') || 'tone', liveNode: null, liveStream: null, fileName: '',
    post(m) { if (this.port) this.port.postMessage(m); },
    get running() { return !!this.ctx && this.ctx.state === 'running'; },

    async start() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      this.ctx = ctx;
      ctx.onstatechange = sendConfig;
      const src = `(${wubWorkletModule.toString()})();`;
      const builtin = BUILTIN.find(b => b.id === this.input) || BUILTIN[0];
      const options = { params: values, bpm, source: { gen: builtin.type, freq: builtin.freq, level: builtin.level } };
      let built = null;
      if (ctx.audioWorklet && location.protocol !== 'file:') {
        try {
          const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          const node = new AudioWorkletNode(ctx, 'i-wub-you', {
            numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2], channelCount: 2, channelCountMode: 'explicit', processorOptions: options,
          });
          node.port.onmessage = (e) => onDspMessage(e.data);
          // an exception inside the audio thread silences the node: say so instead of failing quietly
          node.onprocessorerror = (e) => {
            audio.error = 'the audio engine stopped (processor error); reload the page';
            console.error('AudioWorklet processor error', e);
            message(`Audio engine error: ${(e && e.message) || 'processor error'}. Reload the page.`);
            sendConfig();
          };
          built = { node, port: node.port, mode: 'AudioWorklet' };
        } catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor', e); }
      }
      if (!built) built = this.scriptProcessor(ctx, src, options);
      this.node = built.node; this.port = built.port; this.mode = built.mode;
      this.node.connect(ctx.destination);
      this.post({ type: 'params', values: Object.assign({}, values) }); // anything changed while starting
      this.post({ type: 'tempo', bpm });
      if (!BUILTIN.some(b => b.id === this.input)) this.selectInput(this.input, false);
      sendConfig();
    },

    // Chrome/Edge block worklet modules on file://: run the same DSP on the main thread
    scriptProcessor(ctx, src, options) {
      class AudioWorkletProcessorShim { constructor() { this.port = { postMessage: onDspMessage, onmessage: null }; } }
      let Processor = null;
      new Function('AudioWorkletProcessor', 'registerProcessor', 'sampleRate', src)(
        AudioWorkletProcessorShim, (name, cls) => { Processor = cls; }, ctx.sampleRate);
      const proc = new Processor({ processorOptions: options });
      const L128 = new Float32Array(128), R128 = new Float32Array(128), iL = new Float32Array(128), iR = new Float32Array(128);
      const node = ctx.createScriptProcessor(1024, 2, 2);
      node.onaudioprocess = (e) => {
        const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
        const inL = e.inputBuffer.getChannelData(0), inR = e.inputBuffer.numberOfChannels > 1 ? e.inputBuffer.getChannelData(1) : inL;
        for (let off = 0; off < L.length; off += 128) {
          iL.set(inL.subarray(off, off + 128)); iR.set(inR.subarray(off, off + 128));
          proc.process([[iL, iR]], [[L128, R128]]);
          L.set(L128, off); R.set(R128, off);
        }
      };
      return { node, port: { postMessage: (m) => proc.port.onmessage({ data: m }) }, mode: 'ScriptProcessor' };
    },

    // the input source: a built-in generator (inside the engine), or a live node into the worklet
    async selectInput(id, announce) {
      const ctx = this.ctx;
      if (!ctx) { this.input = id; return; }
      const builtin = BUILTIN.find(b => b.id === id);
      const stopLive = () => {
        if (this.liveNode) { try { this.liveNode.disconnect(); } catch (e) { /* already */ } this.liveNode = null; }
        if (this.liveStream) { this.liveStream.getTracks().forEach(t => t.stop()); this.liveStream = null; }
      };
      try {
        if (builtin) {
          stopLive();
          // the message type is 'source'; the generator type travels as `gen`
          this.post({ type: 'source', gen: builtin.type, freq: builtin.freq, level: builtin.level });
        } else if (id === 'mic') {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
          stopLive();
          this.liveStream = stream;
          this.liveNode = ctx.createMediaStreamSource(stream);
          this.liveNode.connect(this.node);
          this.post({ type: 'source', gen: -1 });
          if (announce) message('Input: microphone / line-in (use headphones). Auto Gain brings it to -18 dBFS.');
        } else if (id === 'tab') {
          const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          stream.getVideoTracks().forEach(t => t.stop());
          if (!stream.getAudioTracks().length) throw new Error('no audio was shared: tick "Share tab audio" / "Share system audio" in the picker');
          stopLive();
          this.liveStream = stream;
          this.liveNode = ctx.createMediaStreamSource(stream);
          this.liveNode.connect(this.node);
          this.post({ type: 'source', gen: -1 });
          stream.getAudioTracks()[0].onended = () => { if (this.input === 'tab') { this.selectInput('tone', true); toUi('inputs', inputList()); } };
          if (announce) message('Input: the shared tab / screen audio. Note the original keeps playing too unless you muted the tab.');
        } else if (id === 'file') {
          const file = await pickFile();
          if (!file) { toUi('inputs', inputList()); return; }
          const buffer = await ctx.decodeAudioData(await file.arrayBuffer());
          stopLive();
          const node = ctx.createBufferSource();
          node.buffer = buffer;
          node.loop = true;
          node.connect(this.node);
          node.start();
          this.liveNode = node;
          this.fileName = file.name;
          this.post({ type: 'source', gen: -1 });
          if (announce) message(`Input: ${file.name} (${buffer.duration.toFixed(1)} s, looped)`);
        }
        this.input = id;
        store.set('wub.input', id);
      } catch (e) {
        if (!(e && e.name === 'AbortError')) message(`Input: ${e.message || e}`);
        this.input = BUILTIN[0].id;
        this.post({ type: 'source', gen: BUILTIN[0].type, freq: BUILTIN[0].freq, level: BUILTIN[0].level });
      }
      toUi('inputs', inputList());
    },
  };

  function inputList() {
    const list = BUILTIN.map(b => ({ id: b.id, name: b.name })).concat(LIVE.map(l => ({ id: l.id, name: l.id === 'file' && audio.fileName ? `File: ${audio.fileName}` : l.name })));
    return { inputs: list, selected: audio.input };
  }

  const fileInputAudio = document.createElement('input');
  fileInputAudio.type = 'file';
  fileInputAudio.accept = 'audio/*,.wav,.mp3,.flac,.ogg,.m4a';
  fileInputAudio.style.display = 'none';
  let filePick = null;
  fileInputAudio.addEventListener('change', () => { const f = fileInputAudio.files && fileInputAudio.files[0]; fileInputAudio.value = ''; if (filePick) filePick(f || null); filePick = null; });
  function pickFile() {
    return new Promise((res) => { filePick = res; fileInputAudio.click(); });
  }

  // what the engine reports: stats for the scope, the meters and the lamps; and, with Source Type = Auto,
  // the analysis' decision loads that type's defaults (once per decision), like the plugin's timer
  let appliedDetected = -1;
  function onDspMessage(m) {
    if (m.type !== 'stats') return;
    toUi('stats', { peakIn: m.peakIn, peakOut: m.peakOut, lfo: m.lfo, lfoR: m.lfoR, cutoff: m.cutoff, autoGain: m.autoGain, detected: m.detected,
                    bpm: m.bpm, playing: m.playing, note: m.note, pitch: m.pitch, pitchConf: m.pitchConf, harm: m.harm, autoOut: m.autoOut, limiter: m.limiter });
    if (Math.round(values.source) === 0) {
      if (m.detected >= 0 && m.detected !== appliedDetected) {
        appliedDetected = m.detected;
        const defaults = wubSourceDefaults(FACTORY_JSON, m.detected + 1);
        for (const id of Object.keys(defaults)) if (id !== 'source') hostSetParam(id, defaults[id]);
        message(`Auto: ${SOURCES[m.detected + 1]} detected, its defaults loaded`);
      }
    } else appliedDetected = -1;
  }

  function sendConfig() {
    const c = audio.ctx;
    let text;
    if (audio.error) text = `Audio error: ${audio.error}`;
    else if (!audio.running) text = 'Click or tap anywhere to enable audio';
    else text = `Web · ${audio.mode} · ${(c.sampleRate / 1000).toFixed(1)} kHz · ~${(((c.baseLatency || 0) + (c.outputLatency || 0)) * 1000).toFixed(1)} ms`;
    toUi('config', { wrapper: 'Web', sampleRate: c ? c.sampleRate : 0, blockSize: 128, audio: text, running: audio.running, startPage: '' });
  }

  const started = audio.start().catch((e) => { audio.error = e.message || String(e); console.error(e); sendConfig(); });
  function unlockAudio() {
    if (audio.running || audio.error) return;
    started.then(() => audio.ctx && audio.ctx.resume()).then(sendConfig).catch(() => {});
  }
  document.addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInputAudio));
  else document.body.appendChild(fileInputAudio);

  // ----------------------------------------------------------------- MIDI ---
  if (typeof navigator.requestMIDIAccess === 'function') {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      const bind = () => { for (const input of access.inputs.values()) input.onmidimessage = (e) => audio.post({ type: 'midi', data: Array.from(e.data) }); };
      access.onstatechange = bind;
      bind();
      const n = Array.from(access.inputs.values()).length;
      if (n) message(`MIDI ready: ${n} input(s). Notes retrigger the LFO when Retrigger is set to MIDI Note.`);
    }).catch(() => {});
  }

  // -------------------------------------------------------------- presets ---
  const LS_KEY = 'wub.userPresets.v1';
  const local = {
    read() { try { return JSON.parse(store.get(LS_KEY)) || {}; } catch (e) { return {}; } },
    write(obj) { return store.set(LS_KEY, JSON.stringify(obj)); },
  };
  const localPresets = () => Object.keys(local.read()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(name => ({ id: `local:${name}`, name, category: 'User', factory: false }));

  const fsSupported = typeof window.showDirectoryPicker === 'function';
  const folder = { handle: null, granted: false, files: [], sig: '' };
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('i-wub-you', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
  };

  async function scanFolder() {
    if (!folder.handle || !folder.granted) return false;
    const files = [];
    async function walk(dir, path) {
      for await (const [name, h] of dir.entries()) {
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === 'directory') await walk(h, rel);
        else if (name.toLowerCase().endsWith(WUB_PRESET_EXT)) {
          const f = await h.getFile();
          files.push({ id: `user:${rel}`, name: name.slice(0, -WUB_PRESET_EXT.length), category: path || 'User',
                       factory: false, handle: h, parent: dir, fileName: name, stamp: `${f.size}:${f.lastModified}` });
        }
      }
    }
    try { await walk(folder.handle, ''); } catch (e) { folder.granted = false; return true; }
    files.sort((a, b) => a.category.localeCompare(b.category, undefined, { numeric: true }) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const sig = files.map(f => `${f.id}|${f.stamp}`).join(';');
    if (sig === folder.sig) return false;
    folder.sig = sig;
    folder.files = files;
    return true;
  }

  function allPresets() { return [...FACTORY, ...folder.files, ...localPresets()]; }
  function sendPresetList() {
    toUi('presetList', {
      presets: allPresets().map(({ id, name, category, factory }) => ({ id, name, category, factory })),
      folder: folder.granted ? `${folder.handle.name} (linked folder)` : 'this browser: click FOLDER to link a folder on disk',
    });
  }

  async function linkFolder(handle, ask) {
    folder.handle = handle;
    folder.sig = '';
    let state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted' && ask) state = await handle.requestPermission({ mode: 'readwrite' });
    folder.granted = state === 'granted';
    await idb.set('presetFolder', handle);
    if (folder.granted) await scanFolder();
    sendPresetList();
    return folder.granted;
  }
  if (fsSupported && window.indexedDB) {
    idb.get('presetFolder').then(async (h) => {
      if (h && !(await linkFolder(h, false))) message(`Click FOLDER to reconnect the preset folder "${h.name}"`);
    }).catch(() => {});
  }
  setInterval(async () => { if (await scanFolder()) sendPresetList(); }, 2000); // autoload, like the plugin

  // Same rules as PresetManager::readJson: migrate, then at least one known parameter.
  function parsePresetText(text, fallbackName) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(`Not a valid preset file: ${fallbackName}`); }
    if (!json || typeof json !== 'object') throw new Error(`Not an I Wub You preset: ${fallbackName}`);
    wubMigratePreset(json);
    const params = {};
    if (wubApplyParamObject(json.params, params) === 0) throw new Error(`No I Wub You settings found in ${fallbackName}`);
    return { name: String(json.name || '').trim() || fallbackName, category: String(json.category || ''), params };
  }
  function presetText(name, category) {
    const params = {};
    for (const d of PARAM_DEFS) {
      if (d.noPreset) continue;
      params[d.id] = +Number(values[d.id]).toPrecision(6);   // like PresetManager::toJson: 6 significant digits
    }
    return JSON.stringify({ format: WUB_PRESET_FORMAT, version: WUB_PRESET_VERSION, name, category, params }, null, 2);
  }
  const legalName = (s) => s.trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

  async function loadPresetById(id) {
    const p = allPresets().find(x => x.id === id);
    if (!p) { message('Preset not found (was it moved or deleted?)'); toUi('preset', current); return; }
    try {
      const info = { id, name: p.name, category: p.category };
      if (p.factory) applyPreset(p.values, info);
      else {
        const text = id.startsWith('local:') ? local.read()[p.name] : await (await p.handle.getFile()).text();
        const parsed = parsePresetText(text, p.name);
        applyPreset(parsed.params, info);
      }
    } catch (e) { message(e.message || String(e)); toUi('preset', current); }
  }

  async function savePreset(rawName, overwrite) {
    const name = legalName(rawName);
    const result = (r) => toUi('saveResult', Object.assign({ name, ok: false, exists: false, error: '' }, r));
    if (!name) return result({ error: 'Enter a name for the preset' });
    try {
      if (folder.granted) {
        const fileName = name + WUB_PRESET_EXT;
        if (!overwrite) {
          let exists = true;
          try { await folder.handle.getFileHandle(fileName); } catch (e) { exists = false; }
          if (exists) return result({ exists: true });
        }
        const w = await (await folder.handle.getFileHandle(fileName, { create: true })).createWritable();
        await w.write(presetText(name, 'User'));
        await w.close();
        await scanFolder();
        current = { id: `user:${fileName}`, name, category: 'User' };
      } else {
        const all = local.read();
        if (!overwrite && all[name]) return result({ exists: true });
        all[name] = presetText(name, 'User');
        if (!local.write(all)) throw new Error('browser storage is unavailable (private window?)');
        current = { id: `local:${name}`, name, category: 'User' };
      }
      sendPresetList();
      toUi('preset', current);
      result({ ok: true });
    } catch (e) { result({ error: e.message || String(e) }); }
  }

  async function deletePreset(id) {
    const p = allPresets().find(x => x.id === id);
    try {
      if (!p || p.factory) throw new Error('Only user presets can be deleted');
      if (id.startsWith('local:')) { const all = local.read(); delete all[p.name]; local.write(all); }
      else { await p.parent.removeEntry(p.fileName); await scanFolder(); }
      if (current.id === id) current = { id: '', name: current.name, category: 'User' };
      message(`Deleted preset "${p.name}"`);
    } catch (e) { message(e.message || String(e)); }
    sendPresetList();
    toUi('preset', current);
  }

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = `${WUB_PRESET_EXT},application/json`;
  fileInput.style.display = 'none';
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInput));
  else document.body.appendChild(fileInput);   // dev.html loads this after the document is ready
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try {
      const p = parsePresetText(await f.text(), f.name.replace(/\.[^.]+$/, ''));
      applyPreset(p.params, { id: `file:${f.name}`, name: p.name, category: 'File' });
      message(`Loaded ${f.name}`);
    } catch (e) { message(e.message || String(e)); }
  });

  async function folderButton() {
    if (!fsSupported) { message('Linking a preset folder needs Chrome or Edge: presets are saved in this browser instead.'); return; }
    try {
      if (folder.handle && !folder.granted) { if (await linkFolder(folder.handle, true)) message(`Reconnected "${folder.handle.name}"`); return; }
      const handle = await window.showDirectoryPicker({ id: 'wub-presets', mode: 'readwrite', startIn: 'documents' });
      await linkFolder(handle, true);
      message(`Preset folder linked: ${handle.name}, ${folder.files.length} preset(s). Link Documents\\I Wub You\\Presets to share presets with the VST.`);
    } catch (e) { if (e && e.name !== 'AbortError') message(`Folder: ${e.message || e}`); }
  }

  // ------------------------------------------------- UI -> host events ---
  Object.assign(handlers, {
    uiReady() {
      sendConfig();
      sendPresetList();
      toUi('params', Object.assign({}, values));
      toUi('preset', current);
      toUi('inputs', inputList());
      toUi('stats', { peakIn: 0, peakOut: 0, lfo: 0, lfoR: 0, cutoff: [0, 0, 0], autoGain: 0, detected: -1, bpm, playing: true, note: -1, pitch: 0, pitchConf: 0, harm: 0, autoOut: 0, limiter: 0 });
    },
    paramMenu() {}, // no host automation menu in a browser
    setParam({ id, value }) {
      const d = PARAM_BY_ID[id];
      if (!d) return;
      let v = clamp(Number(value), d.min, d.max);
      if (d.step) v = Math.round(v / d.step) * d.step;
      values[id] = v;
      audio.post({ type: 'param', id, value: v });
    },
    gesture() {},
    retrig() { audio.post({ type: 'retrig' }); },
    sourceType({ type }) {
      appliedDetected = -1;   // Auto picked again: its next decision loads afresh
      const defaults = wubSourceDefaults(FACTORY_JSON, type);
      for (const id of Object.keys(defaults)) hostSetParam(id, defaults[id]);
    },
    selectInput({ id }) { if (!audio.running) message('Audio is off: click anywhere on the page once to enable it'); audio.selectInput(id, true); },
    setTempo({ bpm: b }) { bpm = clamp(Number(b) || 120, 20, 300); store.set('wub.bpm', String(bpm)); audio.post({ type: 'tempo', bpm }); },
    selectMidi() {},
    loadPreset({ id }) { loadPresetById(id); },
    savePreset({ name, overwrite }) { savePreset(String(name || ''), overwrite); },
    deletePreset({ id }) { deletePreset(id); },
    loadPresetFile() { fileInput.click(); },
    openPresetFolder() { folderButton(); },
  });

  // Test hook (tests/run-web-tests.ps1): a read-only view of the host state, a tap on what goes to
  // the DSP, and the MIDI entry point (as if a device sent the bytes).
  window.__wubWebHost = {
    values, factory: FACTORY, get current() { return current; }, get audioMode() { return audio.mode; }, get input() { return audio.input; },
    get bpm() { return bpm; },
    sent: [], tap: false,
    midi(bytes) { audio.post({ type: 'midi', data: Array.from(bytes) }); },
  };
  const post = audio.post.bind(audio);
  audio.post = (m) => { if (window.__wubWebHost.tap) window.__wubWebHost.sent.push(m); post(m); };
})();

</script>
<script>
// ============================================================================
//  JUCE bridge: talks to the C++ processor through JUCE 8's native
//  integration (window.__JUCE__.backend). In the web build,
//  vst/webhost/web-host.js provides the same backend on top of Web Audio.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'inputs', 'midiInputs']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }

  // restart the LFOs (the RETRIG button)
  retrig() { this.emit('retrig'); }

  // pick a source type: the host sets it and loads its defaults (cutoff range, drive, crossover, bands)
  sourceType(type) { this.emit('sourceType', { type }); }

  // right-click on a control -> the host's parameter menu (automation, MIDI learn...)
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // web build only (the plugin takes audio and tempo from the host)
  selectInput(id) { this.emit('selectInput', { id }); }
  setTempo(bpm) { this.emit('setTempo', { bpm }); }
  selectMidi(id) { this.emit('selectMidi', { id }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, overwrite) { this.emit('savePreset', { name, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
}

// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture, label) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${label || def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

  <script>
// ============================================================================
//  Parameter controls besides the knob. Same conventions as Knob:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    Meter        - a level meter (not a control): setLevel(0..1 peak)
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (this.buttons[i].disabled) return;
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

// A vertical peak meter with a slow-falling peak mark. setLevel(peak 0..1) at the stats rate.
class Meter {
  constructor(label) {
    const el = document.createElement('div');
    el.className = 'meter';
    el.innerHTML = `<div class="meter-well"><div class="meter-fill"></div><div class="meter-peak"></div></div><span class="ctl-label">${label}</span><span class="meter-db">-∞</span>`;
    this.el = el;
    this.fill = el.querySelector('.meter-fill');
    this.peakEl = el.querySelector('.meter-peak');
    this.db = el.querySelector('.meter-db');
    this.level = 0; this.hold = 0; this.holdAge = 0;
  }
  // dBFS -> 0..1 of the meter height, -60 dB at the bottom
  static pos(db) { return clamp((db + 60) / 60, 0, 1); }
  setLevel(peak) {
    const db = 20 * Math.log10(Math.max(peak, 1e-6));
    const p = Meter.pos(db);
    this.level = Math.max(p, this.level * 0.8);
    if (p >= this.hold) { this.hold = p; this.holdAge = 0; } else if (++this.holdAge > 30) this.hold = Math.max(p, this.hold - 0.01);
    this.fill.style.height = `${this.level * 100}%`;
    this.peakEl.style.bottom = `${this.hold * 100}%`;
    this.peakEl.classList.toggle('hot', this.hold > Meter.pos(-1));
    this.db.textContent = peak < 1e-5 ? '-∞' : `${db.toFixed(0)}`;
  }
}
